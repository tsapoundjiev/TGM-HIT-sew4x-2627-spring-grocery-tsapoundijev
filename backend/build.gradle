plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'at.ac.tgm'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
    
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = file("${projectDir}/../frontend")
def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "npm.cmd" : "npm"

tasks.register("npmInstall", Exec) {
    workingDir = frontendDir
    commandLine npmCommand, "install"
    inputs.file("${frontendDir}/package.json")
    inputs.file("${frontendDir}/package-lock.json")
    outputs.dir("${frontendDir}/node_modules")
}

tasks.register("buildFrontend", Exec) {
    dependsOn "npmInstall"
    workingDir = frontendDir
    commandLine npmCommand, "run", "build"

    inputs.dir("${frontendDir}/src")
    inputs.file("${frontendDir}/vite.config.ts")
    outputs.dir("${frontendDir}/dist")
}

tasks.register("copyFrontend", Copy) {
    dependsOn "buildFrontend"
    from "${frontendDir}/dist"
    into layout.buildDirectory.dir("frontend-static")
}

tasks.named("bootJar") {
    dependsOn "copyFrontend"
    from(layout.buildDirectory.dir("frontend-static")) {
        into "BOOT-INF/classes/static"
    }
}
